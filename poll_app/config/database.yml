# -----------------------------------------------------
# ローカル開発・テスト環境 (SQLite3) のデフォルト設定
# -----------------------------------------------------
default: &default
  # Active Record の接続プールサイズをPumaのスレッド数に合わせる
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  adapter: sqlite3
  database: db/development.sqlite3

test:
  <<: *default
  adapter: sqlite3
  database: db/test.sqlite3
  
# -----------------------------------------------------
# 本番環境 (Production) の設定 - PostgreSQL/DATABASE_URLを使用
# -----------------------------------------------------
production:
  # primary: &primary_production で本番環境の接続情報（PostgreSQL/DATABASE_URL）を定義し、アンカーとして保存する
  primary: &primary_production
    # SQLiteのデフォルト設定を上書きするため、ここではadapterとdatabaseを明示的に設定
    adapter: postgresql
    encoding: unicode
    
    # 接続情報全体を環境変数 DATABASE_URL から取得する (画像で指示されたキー)
    url: <%= ENV['DATABASE_URL'] %>
    
    # コネクションプールサイズはPumaの設定と一致させる
    pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
    timeout: 5000
    
  # メインの production 環境は primary の設定を参照する
  <<: *primary_production

  # Action Cable の設定（primary と同じデータベースを使うが、マイグレーションパスを分ける）
  cable:
    <<: *primary_production
    migrations_paths: db/cable_migrate

  # Cache の設定
  cache:
    <<: *primary_production
    migrations_paths: db/cache_migrate

  # Active Job の Queue の設定
  queue:
    <<: *primary_production
    migrations_paths: db/queue_migrate